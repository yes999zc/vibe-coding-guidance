    <rect x="940" y="165" width="220" height="310" rx="16" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="940" y="165" width="220" height="310" rx="16" fill="url(#l4)" fill-opacity="0.04"/>
    <rect x="940" y="165" width="6" height="310" rx="3" fill="url(#l4)"/>
    <text x="1050" y="200" text-anchor="middle" font-size="32" font-weight="800" fill="url(#l4)">L4</text>
    <text x="1050" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#ec4899" letter-spacing="3">ORCHESTRATED</text>
    <line x1="970" y1="238" x2="1130" y2="238" stroke="#ec4899" stroke-opacity="0.15" stroke-width="1"/>
    <text x="960" y="262" font-size="11" font-weight="600" fill="#94a3b8">UPSTREAM INVESTMENT</text>
    <text x="960" y="282" font-size="20" font-weight="700" fill="#e2e8f0">High</text>
    <text x="960" y="302" font-size="11" fill="#64748b">Multi-agent + CI/CD + TDD</text>
    <text x="960" y="326" font-size="11" font-weight="600" fill="#94a3b8">QUALITY ASSURANCE</text>
    <text x="960" y="346" font-size="12" fill="#64748b">Automated tests + code review</text>
    <text x="960" y="370" font-size="11" font-weight="600" fill="#94a3b8">BEST FOR</text>
    <text x="960" y="390" font-size="12" fill="#64748b">Production SaaS</text>
    <text x="960" y="406" font-size="12" fill="#64748b">Multi-team projects</text>
    <text x="960" y="430" font-size="11" font-weight="600" fill="#94a3b8">KARPATHY RULES</text>
    <text x="960" y="450" font-size="12" fill="#64748b">Strict — Goal-Driven core</text>
  </g>

  <!-- Decision Tree Section -->
  <text x="40" y="520" font-size="13" font-weight="600" fill="#a5b4fc">ROUTING LOGIC</text>

  <!-- Q1: Project Type -->
  <g>
    <rect x="40" y="536" width="360" height="160" rx="12" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="60" y="562" font-size="13" font-weight="700" fill="#c7d2fe">Q1: What are you building?</text>
    <text x="60" y="586" font-size="12" fill="#94a3b8">▸ One-off demo / Prototype</text>
    <text x="60" y="606" font-size="12" fill="#94a3b8">▸ Internal tool / Personal product</text>
    <text x="60" y="626" font-size="12" fill="#94a3b8">▸ Production SaaS / User data</text>
    <text x="60" y="646" font-size="12" fill="#ef4444">▸ Infrastructure / Security-critical</text>
    <text x="310" y="646" font-size="11" fill="#ef4444">→ Don't vibe</text>
  </g>

  <!-- Arrow Q1→Q2 -->
  <line x1="400" y1="616" x2="432" y2="616" stroke="#6366f1" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow-right)"/>

  <!-- Q2: Experience -->
  <g>
    <rect x="440" y="536" width="360" height="160" rx="12" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="460" y="562" font-size="13" font-weight="700" fill="#c7d2fe">Q2: Your technical background?</text>
    <text x="460" y="586" font-size="12" fill="#64748b">▸ Non-developer / Beginner</text>
    <text x="460" y="606" font-size="12" fill="#64748b">▸ Can read and tweak code</text>
    <text x="460" y="626" font-size="12" fill="#64748b">▸ Senior engineer</text>
  </g>

  <!-- Arrow Q2→Q3 -->
  <line x1="800" y1="616" x2="832" y2="616" stroke="#6366f1" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow-right)"/>

  <!-- Q3: Verification -->
  <g>
    <rect x="840" y="536" width="320" height="160" rx="12" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="860" y="562" font-size="13" font-weight="700" fill="#c7d2fe">Q3: Verification rigor?</text>
    <text x="860" y="586" font-size="12" fill="#94a3b8">▸ "Does it run?" is enough</text>
    <text x="860" y="606" font-size="12" fill="#94a3b8">▸ Manual test checklist</text>
    <text x="860" y="626" font-size="12" fill="#94a3b8">▸ Automated tests + CI</text>
  </g>

  <!-- Karpathy Principles Banner -->
  <rect x="40" y="720" width="1120" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="746" font-size="13" font-weight="600" fill="#a5b4fc">KARPATHY BEHAVIORAL PRINCIPLES</text>
  <text x="60" y="768" font-size="12" fill="#64748b">Think Before Coding</text>
  <circle cx="55" cy="763" r="3" fill="#6366f1"/>
  <text x="220" y="768" font-size="12" fill="#64748b">Simplicity First</text>
  <circle cx="215" cy="763" r="3" fill="#6366f1"/>
  <text x="380" y="768" font-size="12" fill="#64748b">Surgical Changes</text>
  <circle cx="375" cy="763" r="3" fill="#6366f1"/>
  <text x="550" y="768" font-size="12" fill="#64748b">Goal-Driven Execution</text>
  <circle cx="545" cy="763" r="3" fill="#6366f1"/>

  <!-- Application intensity -->
  <text x="740" y="746" font-size="11" fill="#94a3b8">Application:</text>
  <rect x="830" y="736" width="60" height="12" rx="6" fill="#22c55e" fill-opacity="0.2"/>
  <text x="835" y="745" font-size="9" fill="#22c55e">L1: Skip</text>
  <rect x="900" y="736" width="60" height="12" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="905" y="745" font-size="9" fill="#3b82f6">L2: Light</text>
  <rect x="970" y="736" width="70" height="12" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
  <text x="975" y="745" font-size="9" fill="#8b5cf6">L3: Full</text>
  <rect x="1050" y="736" width="70" height="12" rx="6" fill="#ec4899" fill-opacity="0.2"/>
  <text x="1055" y="745" font-size="9" fill="#ec4899">L4: Strict</text>

  <!-- Trap counter -->
  <text x="740" y="768" font-size="11" fill="#94a3b8">Traps: 5 cross-level pitfalls in SKILL.md</text>

  <!-- Footer -->
  <text x="600" y="840" text-anchor="middle" font-size="10" fill="#475569">github.com/yes999zc/vibe-coding-guidance  •  MIT License  •  v1.0</text>

  <!-- Decorative dots -->
  <circle cx="1150" cy="50" r="2" fill="#6366f1" fill-opacity="0.4"/>
  <circle cx="1165" cy="40" r="1.5" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="1140" cy="35" r="1" fill="#6366f1" fill-opacity="0.2"/>
  <circle cx="50" cy="830" r="2" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="35" cy="845" r="1.5" fill="#6366f1" fill-opacity="0.2"/>
</svg>
